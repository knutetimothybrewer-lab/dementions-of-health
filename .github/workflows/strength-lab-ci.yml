name: Strength Lab CI
on:
  push:
    branches: [codex/strength-lab]
    paths: ['strength-lab/**', '.github/workflows/strength-lab-ci.yml']
  pull_request:
    paths: ['strength-lab/**', '.github/workflows/strength-lab-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strength-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strength-lab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: strength-lab-browser-traces
          path: strength-lab/test-results
